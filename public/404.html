<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self';" />
    <meta name="robots" content="noindex" />
    <title>Page Not Found | Mst. Fahmida Sultana Naznin</title>

    <!--
      This file is GitHub Pages' handler for any unmatched path. Its real job is
      to bounce deep links back into the single-page app (see spa-redirect.js);
      the markup below is the no-JavaScript fallback, and is all a visitor sees
      if scripts are blocked. Genuinely unknown routes land on the app's own
      designed 404 screen once the router takes over.
    -->
    <script src="/fahmida_protofolio/spa-redirect.js"></script>

    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        background: #1E1B18;
        color: #E8FCC2;
        font-family: Georgia, 'Times New Roman', serif;
        display: flex; align-items: center; justify-content: center;
        text-align: center; padding: 24px;
      }
      .code { font-size: 14px; letter-spacing: 5px; color: #B1CC74; margin: 0 0 18px; }
      h1 { font-size: clamp(28px, 6vw, 44px); margin: 0 0 14px; font-weight: 700; }
      p { color: #829399; font-family: Helvetica, Arial, sans-serif; font-size: 16px; margin: 0 0 28px; }
      a {
        display: inline-block; padding: 13px 26px; border: 1px solid #B1CC74;
        border-radius: 6px; color: #B1CC74; text-decoration: none;
        font-family: Helvetica, Arial, sans-serif; font-size: 15px;
      }
      a:hover, a:focus-visible { background: #B1CC74; color: #1E1B18; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>This page could not be found.</h1>
      <p>The link may be outdated, or the page may have moved.</p>
      <a href="/fahmida_protofolio/">Return to the portfolio</a>
    </main>
  </body>
</html>
