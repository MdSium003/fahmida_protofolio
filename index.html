    <!--
      Content Security Policy.
      GitHub Pages cannot set HTTP response headers, so the policy is delivered
      via meta. Note the consequences of that: `frame-ancestors`, `X-Frame-Options`
      and `Permissions-Policy` are IGNORED in meta form and are simply not
      available on this host. Clickjacking protection therefore relies on
      src/frameGuard.js rather than on a header.

      Allow-list covers exactly the external origins the site actually uses:
        - fonts.googleapis.com / fonts.gstatic.com : Google Fonts
        - www.youtube-nocookie.com                 : all 8 video embeds
        - img.youtube.com / i.ytimg.com            : video thumbnails
      Everything else falls through to 'none'. Note youtube.com itself is NOT
      allow-listed — every embed goes through the no-cookie domain, and
      img.youtube.com redirects thumbnail requests to i.ytimg.com.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'none';
        base-uri 'self';
        form-action 'none';
        object-src 'none';
        script-src 'self';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: blob: https://i.ytimg.com https://img.youtube.com;
        media-src 'self';
        connect-src 'self';
        frame-src https://www.youtube-nocookie.com;
        manifest-src 'self';
        worker-src 'self' blob:;
        upgrade-insecure-requests;
      "
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
